<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR Treasure Hunt 🗺️</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;touch-action:none}
#root{position:relative;width:100vw;height:100vh;overflow:hidden}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#canvas{position:absolute;inset:0;width:100%;height:100%}
/* HUD */
#hud{position:absolute;top:14px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}
.hc{background:rgba(0,0,0,.6);backdrop-filter:blur(6px);border:.5px solid rgba(255,255,255,.15);border-radius:12px;padding:5px 13px;color:#fff;text-align:center}
.hv{font-size:21px;font-weight:600;line-height:1.2}
.hl{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.05em}
/* Прицел */
#aim{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:72px;height:72px;pointer-events:none}
/* Полоса времени */
#tbar{position:absolute;bottom:0;left:0;height:3px;background:#1D9E75;transition:width .95s linear,background .4s}
/* Экраны */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.88);padding:28px;text-align:center;z-index:20;backdrop-filter:blur(4px)}
.screen h2{color:#fff;font-size:24px;font-weight:600}
.screen p{color:rgba(255,255,255,.6);font-size:14px;line-height:1.7;max-width:290px}
.pips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pip{font-size:26px;background:rgba(255,255,255,.08);border-radius:10px;padding:9px}
.btn{background:#1D9E75;color:#fff;border:none;border-radius:26px;padding:13px 38px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 4px 18px rgba(29,158,117,.35)}
.btn:active{transform:scale(.97)}
.btn2{background:transparent;color:rgba(255,255,255,.65);border:.5px solid rgba(255,255,255,.22);border-radius:26px;padding:10px 30px;font-size:14px;cursor:pointer}
#big-score{font-size:42px;font-weight:700;color:#1D9E75}
/* Вспышка */
.flash{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);font-size:42px;animation:fl .85s forwards;pointer-events:none;z-index:30}
@keyframes fl{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-85%) scale(1.7)}}
/* Радар */
#radar{position:absolute;bottom:66px;right:12px;width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,.55);border:.5px solid rgba(255,255,255,.18);overflow:hidden;pointer-events:none}
.rdot{position:absolute;width:7px;height:7px;border-radius:50%;transform:translate(-50%,-50%)}
#rsweep{position:absolute;width:50%;height:50%;top:50%;left:50%;transform-origin:0 100%;background:rgba(29,158,117,.2);animation:sw 3s linear infinite}
@keyframes sw{to{transform:rotate(360deg)}}
#hint{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:rgba(255,255,255,.45);font-size:12px;pointer-events:none}
</style>
</head>
<body>
<div id="root">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <!-- Прицел -->
  <svg id="aim" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
    <g stroke="white" stroke-width="2.5" fill="none" opacity=".8">
      <path d="M9,22 L9,9 L22,9"/>
      <path d="M50,9 L63,9 L63,22"/>
      <path d="M9,50 L9,63 L22,63"/>
      <path d="M50,63 L63,63 L63,50"/>
    </g>
    <circle cx="36" cy="36" r="2.5" fill="white" opacity=".9"/>
    <circle id="lock-ring" cx="36" cy="36" r="15"
      stroke="#1D9E75" stroke-width="3" fill="none"
      stroke-linecap="round"
      stroke-dasharray="94.25"
      stroke-dashoffset="94.25"
      transform="rotate(-90 36 36)"
      opacity="0"/>
  </svg>

  <div id="hud">
    <div class="hc"><div class="hl">очки</div><div class="hv" id="h-score">0</div></div>
    <div class="hc"><div class="hl">найдено</div><div class="hv" id="h-found">0/8</div></div>
    <div class="hc"><div class="hl">время</div><div class="hv" id="h-time">60</div></div>
  </div>

  <div id="radar"><div id="rsweep"></div></div>
  <div id="hint">Наводи прицел на сферу и держи</div>
  <div id="tbar" style="width:100%"></div>

  <!-- ЭКРАНЫ -->
  <div class="screen" id="s-start">
    <div style="font-size:52px">🗺️</div>
    <h2>AR Treasure Hunt</h2>
    <p>Наводи прицел на сферы с сокровищами — они стоят в пространстве. Держи прицел чтобы собрать!</p>
    <div class="pips">
      <div class="pip">💎</div><div class="pip">⭐</div><div class="pip">🏺</div>
      <div class="pip">🔮</div><div class="pip">🪙</div><div class="pip">📿</div>
    </div>
    <button class="btn" id="btn-cam">📷 Играть с камерой</button>
    <button class="btn2" id="btn-demo">Демо (без камеры)</button>
  </div>

  <div class="screen" id="s-nocam" style="display:none">
    <div style="font-size:48px">📵</div>
    <h2 style="color:#fff">Камера недоступна</h2>
    <p>Разреши доступ в настройках браузера или сыграй в демо.</p>
    <button class="btn" id="btn-demo2">Демо-режим</button>
    <button class="btn2" id="btn-retry">Попробовать снова</button>
  </div>

  <div class="screen" id="s-win" style="display:none">
    <div style="font-size:52px" id="w-emoji">🏆</div>
    <h2 id="w-title">Победа!</h2>
    <div id="big-score"></div>
    <p id="w-stats"></p>
    <button class="btn" id="btn-again">🔄 Играть снова</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// КОНФИГ
// ─────────────────────────────────────────────
const TOTAL       = 8;
const DURATION    = 60;
const LOCK_MS     = 900;    // мс удержания прицела
const CIRC        = 94.25;  // 2π×15
const SPREAD_H    = 100;    // горизонтальный охват мира (градусы)
const SPREAD_V    = 50;     // вертикальный охват
const FOV_H       = 55;     // угол обзора камеры горизонтальный

const TYPES = [
  {e:'💎',pts:50,c1:'#b0eeff',c2:'#0090cc',c3:'#004a80'},
  {e:'⭐',pts:30,c1:'#fff5a0',c2:'#f0a020',c3:'#906000'},
  {e:'🏺',pts:20,c1:'#ffd4a8',c2:'#c06020',c3:'#703010'},
  {e:'🔮',pts:40,c1:'#e8d0ff',c2:'#9040e0',c3:'#401070'},
  {e:'🪙',pts:15,c1:'#fff8c0',c2:'#d0a000',c3:'#806000'},
  {e:'📿',pts:35,c1:'#c0ffe8',c2:'#20c080',c3:'#006040'},
];

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let items=[], running=false, score=0, found=0, timeLeft=DURATION;
let animId=null, timerInt=null;
let lockItem=null, lockStart=0;

// Виртуальная камера — углы в градусах
let camYaw=0, camPitch=0;

// Гироскоп
let gyroYaw0=null, gyroPitch0=null;  // начальные значения
let lastAlpha=null, lastBeta=null;

// Демо-перетаскивание
let drag=null;

// ─────────────────────────────────────────────
// DOM
// ─────────────────────────────────────────────
const video    = document.getElementById('video');
const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const root     = document.getElementById('root');
const lockRing = document.getElementById('lock-ring');

function resize(){
  canvas.width  = root.clientWidth;
  canvas.height = root.clientHeight;
}
resize();
window.addEventListener('resize', resize);

// ─────────────────────────────────────────────
// СПАВН
// ─────────────────────────────────────────────
function spawn(){
  items=[];
  for(let i=0;i<TOTAL;i++){
    const t=TYPES[Math.floor(Math.random()*TYPES.length)];
    items.push({
      ...t,
      yaw:   (Math.random()-.5)*SPREAD_H,
      pitch: (Math.random()-.5)*SPREAD_V,
      phase: Math.random()*Math.PI*2,
      done:  false, id:i
    });
  }
  radar();
}

// ─────────────────────────────────────────────
// ПРОЕКЦИЯ угол → пиксель
// ─────────────────────────────────────────────
function project(iy, ip){
  const W=canvas.width, H=canvas.height;
  const fovV = FOV_H*(H/W);
  const pph  = W/FOV_H;
  const ppv  = H/fovV;
  return {
    x: W/2 + (iy - camYaw  )*pph,
    y: H/2 + (ip - camPitch)*ppv
  };
}

// ─────────────────────────────────────────────
// СФЕРА
// ─────────────────────────────────────────────
function sphere(sx,sy,r,c1,c2,c3,emoji,a){
  ctx.save();
  ctx.globalAlpha=a;

  // тень
  const sh=ctx.createRadialGradient(sx,sy+r*.9,r*.05,sx,sy+r*.85,r*.75);
  sh.addColorStop(0,'rgba(0,0,0,.3)'); sh.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sh;
  ctx.beginPath(); ctx.ellipse(sx,sy+r*.92,r*.78,r*.22,0,0,Math.PI*2); ctx.fill();

  // тело
  const g=ctx.createRadialGradient(sx-r*.28,sy-r*.28,r*.04,sx,sy,r);
  g.addColorStop(0,c1); g.addColorStop(.55,c2); g.addColorStop(1,c3);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();

  // блик
  const sh2=ctx.createRadialGradient(sx-r*.3,sy-r*.3,0,sx-r*.15,sy-r*.15,r*.55);
  sh2.addColorStop(0,'rgba(255,255,255,.85)');
  sh2.addColorStop(.4,'rgba(255,255,255,.18)');
  sh2.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sh2;
  ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();

  // обводка
  ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.stroke();

  // эмодзи
  ctx.globalAlpha=a*.92;
  ctx.font=Math.round(r*.95)+'px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(emoji,sx,sy+r*.07);

  ctx.restore();
}

// ─────────────────────────────────────────────
// СТРЕЛКА
// ─────────────────────────────────────────────
function arrow(tx,ty,color){
  const W=canvas.width, H=canvas.height;
  const cx=W/2, cy=H/2;
  const angle=Math.atan2(ty-cy,tx-cx);
  const d=Math.min(W,H)/2-46;
  ctx.save();
  ctx.translate(cx+Math.cos(angle)*d, cy+Math.sin(angle)*d);
  ctx.rotate(angle);
  ctx.globalAlpha=.78;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(15,0); ctx.lineTo(-8,8); ctx.lineTo(-4,0); ctx.lineTo(-8,-8);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// ─────────────────────────────────────────────
// РАДАР
// ─────────────────────────────────────────────
function radar(){
  const el=document.getElementById('radar');
  el.querySelectorAll('.rdot').forEach(e=>e.remove());
  items.forEach(it=>{
    if(it.done) return;
    const d=document.createElement('div');
    d.className='rdot';
    const rx=50+(it.yaw  /SPREAD_H)*100;
    const ry=50+(it.pitch/SPREAD_V)*100;
    d.style.cssText=`left:${Math.max(5,Math.min(95,rx))}%;top:${Math.max(5,Math.min(95,ry))}%;background:${it.c2}`;
    el.appendChild(d);
  });
  // позиция игрока
  const c=document.createElement('div');
  const px=50+(camYaw  /SPREAD_H)*100;
  const py=50+(camPitch/SPREAD_V)*100;
  c.style.cssText=`position:absolute;left:${Math.max(5,Math.min(95,px))}%;top:${Math.max(5,Math.min(95,py))}%;width:7px;height:7px;border-radius:50%;background:#1D9E75;transform:translate(-50%,-50%);z-index:3;border:1.5px solid rgba(255,255,255,.5)`;
  el.appendChild(c);
}

// ─────────────────────────────────────────────
// ИГРОВОЙ ЦИКЛ
// ─────────────────────────────────────────────
function loop(ts){
  if(!running) return;
  const W=canvas.width, H=canvas.height;
  const cx=W/2, cy=H/2;
  ctx.clearRect(0,0,W,H);

  let nearest=null, nearDist=Infinity;

  items.forEach(it=>{
    if(it.done) return;
    const p=project(it.yaw, it.pitch);
    const bob=Math.sin(ts*.0009+it.phase)*4;
    const sx=p.x, sy=p.y+bob;

    const R=36; // радиус сферы px

    // fade по краям
    const fade=Math.min(1, Math.min(sx+80, W-sx+80, sy+80, H-sy+80)/80);

    // рисуем сферу
    sphere(sx,sy,R, it.c1,it.c2,it.c3, it.e, Math.max(0,fade));

    // очки
    const dist=Math.hypot(sx-cx,sy-cy);
    if(dist<110){
      ctx.save();
      ctx.globalAlpha=Math.max(0,1-dist/110)*Math.max(0,fade);
      ctx.font='13px -apple-system,sans-serif';
      ctx.fillStyle='#fff';
      ctx.textAlign='center';
      ctx.fillText('+'+it.pts, sx, sy-R-10);
      ctx.restore();
    }

    // стрелка если за краем
    if(sx<-20||sx>W+20||sy<-20||sy>H+20){
      arrow(sx,sy,it.c2);
    }

    if(dist<nearDist){ nearDist=dist; nearest={it,sx,sy,dist,R}; }
  });

  // Прицел — захват
  const hit = nearest && nearDist < nearest.R+14;
  if(hit){
    if(lockItem!==nearest.it){ lockItem=nearest.it; lockStart=ts; }
    const prog=Math.min(1,(ts-lockStart)/LOCK_MS);
    lockRing.style.strokeDashoffset=CIRC*(1-prog);
    lockRing.style.opacity='1';
    if(prog>=1) collect(nearest.it);
  } else {
    lockItem=null;
    lockRing.style.strokeDashoffset=CIRC;
    lockRing.style.opacity='0';
  }

  // Радар каждые ~200мс
  if(Math.floor(ts/200)!==Math.floor((ts-16)/200)) radar();

  animId=requestAnimationFrame(loop);
}

// ─────────────────────────────────────────────
// СБОР
// ─────────────────────────────────────────────
function collect(it){
  if(it.done) return;
  it.done=true; lockItem=null;
  score+=it.pts; found++;
  document.getElementById('h-score').textContent=score;
  document.getElementById('h-found').textContent=found+'/'+TOTAL;
  const f=document.createElement('div');
  f.className='flash'; f.textContent=it.e;
  root.appendChild(f); setTimeout(()=>f.remove(),900);
  if(found>=TOTAL) endGame(true);
}

// ─────────────────────────────────────────────
// ГИРОСКОП (DeviceOrientation)
// ─────────────────────────────────────────────
function startGyro(){
  function handler(e){
    if(!running) return;
    // alpha = компас 0-360, gamma = левый/правый наклон, beta = вперёд/назад
    const alpha = e.alpha||0;
    const beta  = e.beta ||0;
    const gamma = e.gamma||0;

    if(gyroYaw0===null){
      gyroYaw0   = gamma;
      gyroPitch0 = beta;
    }

    // Gamma (-90..90) — поворот телефона влево/вправо
    // Beta (-180..180) — наклон вперёд/назад
    camYaw   = -(gamma - gyroYaw0  ) * 1.2;
    camPitch =  (beta  - gyroPitch0) * 0.8;

    // Ограничиваем
    camYaw   = Math.max(-SPREAD_H/2, Math.min(SPREAD_H/2, camYaw));
    camPitch = Math.max(-SPREAD_V/2, Math.min(SPREAD_V/2, camPitch));
  }

  if(typeof DeviceOrientationEvent!=='undefined'&&
     typeof DeviceOrientationEvent.requestPermission==='function'){
    // iOS 13+
    DeviceOrientationEvent.requestPermission()
      .then(r=>{ if(r==='granted') window.addEventListener('deviceorientation',handler,true); })
      .catch(()=>{});
  } else {
    window.addEventListener('deviceorientation', handler, true);
  }
}

// ─────────────────────────────────────────────
// ДЕМО: перетаскивание
// ─────────────────────────────────────────────
function initDrag(){
  function down(x,y){ drag={x,y,yaw:camYaw,pitch:camPitch}; }
  function move(x,y){
    if(!drag||!running) return;
    camYaw  = drag.yaw   - (x-drag.x)*0.14;
    camPitch= drag.pitch - (y-drag.y)*0.14;
    camYaw  = Math.max(-SPREAD_H/2, Math.min(SPREAD_H/2, camYaw));
    camPitch= Math.max(-SPREAD_V/2, Math.min(SPREAD_V/2, camPitch));
  }
  function up(){ drag=null; }
  canvas.addEventListener('touchstart', e=>{ e.preventDefault(); down(e.touches[0].clientX,e.touches[0].clientY); },{passive:false});
  canvas.addEventListener('touchmove',  e=>{ e.preventDefault(); move(e.touches[0].clientX,e.touches[0].clientY); },{passive:false});
  canvas.addEventListener('touchend',   e=>{ e.preventDefault(); up(); },{passive:false});
  canvas.addEventListener('mousedown',  e=>down(e.clientX,e.clientY));
  canvas.addEventListener('mousemove',  e=>move(e.clientX,e.clientY));
  canvas.addEventListener('mouseup',    up);
}

// ─────────────────────────────────────────────
// ТАЙМЕР
// ─────────────────────────────────────────────
function startTimer(){
  const bar=document.getElementById('tbar');
  timerInt=setInterval(()=>{
    if(!running) return;
    timeLeft--;
    document.getElementById('h-time').textContent=timeLeft;
    bar.style.width=Math.round(timeLeft/DURATION*100)+'%';
    if(timeLeft<=10) bar.style.background='#E24B4A';
    if(timeLeft<=0) endGame(false);
  },1000);
}

// ─────────────────────────────────────────────
// КОНЕЦ
// ─────────────────────────────────────────────
function endGame(win){
  running=false;
  cancelAnimationFrame(animId);
  clearInterval(timerInt);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  document.getElementById('w-emoji').textContent = win?'🏆':'⏰';
  document.getElementById('w-title').textContent = win?'Победа!':'Время вышло!';
  document.getElementById('big-score').textContent= score+' очков';
  document.getElementById('w-stats').textContent  = win
    ? 'Все '+TOTAL+' найдены! Остаток: '+timeLeft+'с'
    : 'Найдено '+found+' из '+TOTAL+'. Попробуй ещё!';
  document.getElementById('s-win').style.display='flex';
}

// ─────────────────────────────────────────────
// СТАРТ
// ─────────────────────────────────────────────
async function startGame(demo){
  cancelAnimationFrame(animId); clearInterval(timerInt);
  items=[]; found=0; score=0; timeLeft=DURATION;
  running=false; lockItem=null; drag=null;
  camYaw=0; camPitch=0; gyroYaw0=null; gyroPitch0=null;

  ['s-start','s-win','s-nocam'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('h-score').textContent='0';
  document.getElementById('h-found').textContent='0/'+TOTAL;
  document.getElementById('h-time').textContent=DURATION;
  document.getElementById('tbar').style.width='100%';
  document.getElementById('tbar').style.background='#1D9E75';
  resize();

  if(demo){
    if(video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
    video.srcObject=null; video.style.display='none';
    root.style.background='linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)';
    document.getElementById('hint').textContent='Тяни пальцем чтобы повернуть камеру';
    initDrag();
  } else {
    try{
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      video.srcObject=stream; video.style.display='block';
      root.style.background='#000';
      document.getElementById('hint').textContent='Поворачивай телефон чтобы искать сокровища';
      startGyro();
    }catch(e){
      video.style.display='none';
      document.getElementById('s-nocam').style.display='flex';
      return;
    }
  }

  spawn();
  running=true;
  requestAnimationFrame(loop);
  startTimer();
}

// ─────────────────────────────────────────────
// КНОПКИ
// ─────────────────────────────────────────────
document.getElementById('btn-cam'  ).onclick=()=>startGame(false);
document.getElementById('btn-demo' ).onclick=()=>startGame(true);
document.getElementById('btn-demo2').onclick=()=>startGame(true);
document.getElementById('btn-retry').onclick=()=>startGame(false);
document.getElementById('btn-again').onclick=()=>{
  if(video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
  video.srcObject=null; video.style.display='none';
  root.style.background='#111';
  document.getElementById('s-win').style.display='none';
  document.getElementById('s-start').style.display='flex';
};
</script>
</body>
</html>
