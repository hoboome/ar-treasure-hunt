<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AR Treasure Hunt 🗺️</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #111; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }

  #game-root { position: relative; width: 100vw; height: 100vh; background: #111; overflow: hidden; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #canvas-ar { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #ui-overlay { position: absolute; inset: 0; pointer-events: none; }

  #hud { position: absolute; top: 16px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start; }
  .hud-card {
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 0.5px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 6px 14px;
    color: #fff;
  }
  .hud-val { font-size: 22px; font-weight: 600; line-height: 1.2; }
  .hud-label { font-size: 11px; color: rgba(255,255,255,0.55); text-transform: uppercase; letter-spacing: 0.05em; }

  #tap-zone { position: absolute; inset: 0; cursor: crosshair; }
  #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 44px; height: 44px; pointer-events: none; }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.65); }
  #crosshair::before { width: 1px; height: 100%; left: 50%; }
  #crosshair::after { width: 100%; height: 1px; top: 50%; }
  #crosshair-ring {
    position: absolute; top: 50%; left: 50%; width: 60px; height: 60px;
    border: 1.5px solid rgba(255,255,255,0.3); border-radius: 50%;
    transform: translate(-50%,-50%); pointer-events: none;
  }

  #collect-btn {
    position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: rgba(29,158,117,0.92); color: #fff; border: none; border-radius: 28px;
    padding: 13px 32px; font-size: 16px; font-weight: 600; cursor: pointer;
    pointer-events: all; display: none; letter-spacing: 0.01em;
    box-shadow: 0 4px 24px rgba(29,158,117,0.4);
    transition: transform 0.1s, background 0.15s;
  }
  #collect-btn:active { transform: translateX(-50%) scale(0.95); background: rgba(15,110,86,0.95); }

  #hint {
    position: absolute; bottom: 20px; left: 12px; right: 12px;
    text-align: center; color: rgba(255,255,255,0.5); font-size: 13px; pointer-events: none;
  }

  #screen-start, #screen-win, #screen-no-cam {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(0,0,0,0.85); padding: 28px; text-align: center; z-index: 10;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .screen-emoji { font-size: 56px; line-height: 1; }
  .screen-title { color: #fff; font-size: 26px; font-weight: 600; }
  .screen-sub { color: rgba(255,255,255,0.6); font-size: 15px; line-height: 1.7; max-width: 300px; }

  .items-preview { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 4px 0; }
  .item-pip { font-size: 28px; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 10px; }

  .btn-primary {
    background: #1D9E75; color: #fff; border: none; border-radius: 28px;
    padding: 14px 40px; font-size: 16px; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 20px rgba(29,158,117,0.35); transition: background 0.15s, transform 0.1s;
  }
  .btn-primary:hover { background: #16876A; }
  .btn-primary:active { transform: scale(0.97); }
  .btn-secondary {
    background: transparent; color: rgba(255,255,255,0.7);
    border: 0.5px solid rgba(255,255,255,0.25); border-radius: 28px;
    padding: 11px 32px; font-size: 15px; cursor: pointer; transition: background 0.15s;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.08); }

  #score-final { font-size: 44px; font-weight: 700; color: #1D9E75; }

  #timer-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: #1D9E75; transition: width 0.9s linear, background 0.5s; }

  .collected-flash {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%,-50%);
    font-size: 36px; animation: flash 0.9s forwards; pointer-events: none; z-index: 20;
  }
  @keyframes flash {
    0% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-80%) scale(1.6); }
  }

  #radar {
    position: absolute; bottom: 70px; right: 14px;
    width: 70px; height: 70px; border-radius: 50%;
    background: rgba(0,0,0,0.55); border: 0.5px solid rgba(255,255,255,0.2);
    overflow: hidden;
  }
  .radar-dot { position: absolute; width: 7px; height: 7px; border-radius: 50%; transform: translate(-50%,-50%); }
  .radar-center { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #1D9E75; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 2; }
  #radar-sweep {
    position: absolute; width: 50%; height: 50%; top: 50%; left: 50%;
    transform-origin: 0% 100%; background: rgba(29,158,117,0.22);
    animation: sweep 3s linear infinite;
  }
  @keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .near-ring {
    position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,0.6);
    pointer-events: none; transform: translate(-50%,-50%); animation: ring-pulse 1s ease-in-out infinite;
  }
  @keyframes ring-pulse { 0%,100% { opacity: 0.6; transform: translate(-50%,-50%) scale(1); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.15); } }

  /* Demo background */
  .demo-bg { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%) !important; }
</style>
</head>
<body>
<div id="game-root">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas-ar"></canvas>

  <!-- START SCREEN -->
  <div id="screen-start">
    <div class="screen-emoji">🗺️</div>
    <div class="screen-title">AR Treasure Hunt</div>
    <p class="screen-sub">Ищи виртуальные сокровища через камеру телефона. Наводи прицел и собирай!</p>
    <div class="items-preview">
      <div class="item-pip">💎</div>
      <div class="item-pip">⭐</div>
      <div class="item-pip">🏺</div>
      <div class="item-pip">🔮</div>
      <div class="item-pip">🪙</div>
      <div class="item-pip">📿</div>
    </div>
    <button class="btn-primary" id="btn-start">🎮 Начать игру</button>
    <button class="btn-secondary" id="btn-demo-start">Демо без камеры</button>
  </div>

  <!-- NO CAMERA SCREEN -->
  <div id="screen-no-cam" style="display:none">
    <div class="screen-emoji">📵</div>
    <div class="screen-title" style="color:#fff">Камера недоступна</div>
    <p class="screen-sub">Разреши доступ к камере в настройках браузера или сыграй в демо-режиме.</p>
    <button class="btn-primary" id="btn-demo">Демо-режим</button>
    <button class="btn-secondary" id="btn-retry">Попробовать снова</button>
  </div>

  <!-- WIN SCREEN -->
  <div id="screen-win" style="display:none">
    <div class="screen-emoji" id="win-emoji">🏆</div>
    <div class="screen-title" id="win-title">Победа!</div>
    <div id="score-final"></div>
    <p class="screen-sub" id="win-stats"></p>
    <button class="btn-primary" id="btn-restart">🔄 Играть снова</button>
  </div>

  <!-- HUD + GAME UI -->
  <div id="ui-overlay">
    <div id="hud">
      <div class="hud-card">
        <div class="hud-label">очки</div>
        <div class="hud-val" id="hud-score">0</div>
      </div>
      <div class="hud-card" style="text-align:center">
        <div class="hud-label">найдено</div>
        <div class="hud-val" id="hud-found">0/8</div>
      </div>
      <div class="hud-card" style="text-align:right">
        <div class="hud-label">время</div>
        <div class="hud-val" id="hud-timer">60</div>
      </div>
    </div>

    <div id="crosshair-ring"></div>
    <div id="crosshair"></div>
    <div id="tap-zone"></div>
    <button id="collect-btn">Собрать!</button>
    <div id="radar">
      <div id="radar-sweep"></div>
      <div class="radar-center"></div>
    </div>
    <div id="hint">Наводи камеру на предметы и нажми «Собрать»</div>
    <div id="timer-bar" style="width:100%"></div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────
const ITEMS_TOTAL = 8;
const GAME_DURATION = 60;
const COLLECT_RADIUS = 90;

const ITEM_TYPES = [
  { emoji: '💎', label: 'Алмаз',  pts: 50, color: '#60c8ff' },
  { emoji: '⭐', label: 'Звезда', pts: 30, color: '#ffd060' },
  { emoji: '🏺', label: 'Кувшин', pts: 20, color: '#d4915a' },
  { emoji: '🔮', label: 'Шар',    pts: 40, color: '#b388ff' },
  { emoji: '🪙', label: 'Монета', pts: 15, color: '#ffe082' },
  { emoji: '📿', label: 'Амулет', pts: 35, color: '#80cbc4' },
];

// ── STATE ───────────────────────────────────────────────
let state = { running: false, score: 0, found: 0, timeLeft: GAME_DURATION, items: [], nearItem: null };
let animId = null, timerInterval = null;

// ── DOM ─────────────────────────────────────────────────
const video   = document.getElementById('video');
const canvas  = document.getElementById('canvas-ar');
const ctx     = canvas.getContext('2d');
const root    = document.getElementById('game-root');

// ── RESIZE ──────────────────────────────────────────────
function resizeCanvas() {
  canvas.width  = root.offsetWidth;
  canvas.height = root.offsetHeight;
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); updateRadar(); });

// ── SPAWN ───────────────────────────────────────────────
function spawnItems() {
  state.items = [];
  for (let i = 0; i < ITEMS_TOTAL; i++) {
    const t = ITEM_TYPES[Math.floor(Math.random() * ITEM_TYPES.length)];
    state.items.push({
      ...t,
      x: 0.08 + Math.random() * 0.84,
      y: 0.18 + Math.random() * 0.60,
      phase: Math.random() * Math.PI * 2,
      speed: 0.3 + Math.random() * 0.4,
      amp:   5 + Math.random() * 8,
      scale: 0.85 + Math.random() * 0.5,
      collected: false,
      id: i,
    });
  }
  updateRadar();
}

// ── RADAR ───────────────────────────────────────────────
function updateRadar() {
  const radar = document.getElementById('radar');
  radar.querySelectorAll('.radar-dot').forEach(e => e.remove());
  state.items.forEach(item => {
    if (item.collected) return;
    const dot = document.createElement('div');
    dot.className = 'radar-dot';
    dot.style.cssText = `left:${item.x*100}%;top:${item.y*100}%;background:${item.color}`;
    radar.appendChild(dot);
  });
}

// ── DRAW ─────────────────────────────────────────────────
function drawItems(ts) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  let closest = null, minDist = Infinity;

  state.items.forEach(item => {
    if (item.collected) return;
    const px = item.x * canvas.width;
    const py = item.y * canvas.height + Math.sin(ts * item.speed * 0.001 + item.phase) * item.amp;
    const sz = Math.round(30 * item.scale);
    const dist = Math.hypot(px - cx, py - cy);

    if (dist < minDist) { minDist = dist; closest = { item, px, py, dist }; }

    // glow
    const glow = dist < COLLECT_RADIUS ? Math.max(0, 1 - dist / COLLECT_RADIUS) : 0;
    if (glow > 0) {
      ctx.save();
      ctx.globalAlpha = glow * 0.35;
      ctx.fillStyle = item.color;
      ctx.beginPath();
      ctx.arc(px, py, sz + 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // emoji
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.font = sz + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.emoji, px, py);

    // points label when near
    if (dist < 120) {
      ctx.globalAlpha = Math.max(0, 1 - dist / 120);
      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText('+' + item.pts, px, py - sz / 2 - 10);
    }
    ctx.restore();
  });

  state.nearItem = (closest && closest.dist < COLLECT_RADIUS) ? closest : null;
  const btn = document.getElementById('collect-btn');
  if (state.nearItem && state.running) {
    btn.style.display = 'block';
    btn.textContent = state.nearItem.item.emoji + ' Собрать (+' + state.nearItem.item.pts + ')';
  } else {
    btn.style.display = 'none';
  }
}

// ── COLLECT ──────────────────────────────────────────────
function collectNear() {
  if (!state.nearItem || !state.running) return;
  const item = state.nearItem.item;
  item.collected = true;
  state.score += item.pts;
  state.found++;
  document.getElementById('hud-score').textContent = state.score;
  document.getElementById('hud-found').textContent = state.found + '/' + ITEMS_TOTAL;

  // flash
  const flash = document.createElement('div');
  flash.className = 'collected-flash';
  flash.textContent = item.emoji;
  document.getElementById('ui-overlay').appendChild(flash);
  setTimeout(() => flash.remove(), 950);

  updateRadar();
  if (state.found >= ITEMS_TOTAL) endGame(true);
}

document.getElementById('tap-zone').addEventListener('click', collectNear);
document.getElementById('collect-btn').addEventListener('click', (e) => { e.stopPropagation(); collectNear(); });

// ── GAME LOOP ────────────────────────────────────────────
function gameLoop(ts) {
  if (!state.running) return;
  drawItems(ts);
  animId = requestAnimationFrame(gameLoop);
}

// ── TIMER ────────────────────────────────────────────────
function startTimer() {
  const bar = document.getElementById('timer-bar');
  timerInterval = setInterval(() => {
    if (!state.running) return;
    state.timeLeft--;
    document.getElementById('hud-timer').textContent = state.timeLeft;
    bar.style.width = Math.round(state.timeLeft / GAME_DURATION * 100) + '%';
    if (state.timeLeft <= 10) bar.style.background = '#E24B4A';
    if (state.timeLeft <= 0) endGame(false);
  }, 1000);
}

// ── END GAME ─────────────────────────────────────────────
function endGame(win) {
  state.running = false;
  cancelAnimationFrame(animId);
  clearInterval(timerInterval);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  document.getElementById('collect-btn').style.display = 'none';

  const screen = document.getElementById('screen-win');
  document.getElementById('win-emoji').textContent  = win ? '🏆' : '⏰';
  document.getElementById('win-title').textContent  = win ? 'Победа!' : 'Время вышло!';
  document.getElementById('score-final').textContent = state.score + ' очков';
  document.getElementById('win-stats').textContent  = win
    ? 'Все ' + ITEMS_TOTAL + ' сокровища найдены! Остаток: ' + state.timeLeft + 'с'
    : 'Найдено ' + state.found + ' из ' + ITEMS_TOTAL + '. Попробуй ещё раз!';
  screen.style.display = 'flex';
}

// ── START GAME ───────────────────────────────────────────
async function startGame(demo = false) {
  cancelAnimationFrame(animId);
  clearInterval(timerInterval);

  state = { running: false, score: 0, found: 0, timeLeft: GAME_DURATION, items: [], nearItem: null };
  ['screen-start','screen-win','screen-no-cam'].forEach(id => document.getElementById(id).style.display = 'none');
  document.getElementById('hud-score').textContent = '0';
  document.getElementById('hud-found').textContent = '0/' + ITEMS_TOTAL;
  document.getElementById('hud-timer').textContent = GAME_DURATION;
  document.getElementById('timer-bar').style.width = '100%';
  document.getElementById('timer-bar').style.background = '#1D9E75';
  resizeCanvas();

  if (!demo) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      video.srcObject = stream;
      video.style.display = 'block';
      root.classList.remove('demo-bg');
    } catch (e) {
      video.style.display = 'none';
      document.getElementById('screen-no-cam').style.display = 'flex';
      return;
    }
  } else {
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    video.srcObject = null;
    video.style.display = 'none';
    root.classList.add('demo-bg');
  }

  spawnItems();
  state.running = true;
  requestAnimationFrame(gameLoop);
  startTimer();
}

function stopCamera() {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  video.srcObject = null;
}

// ── BUTTONS ──────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click',       () => startGame(false));
document.getElementById('btn-demo-start').addEventListener('click',  () => startGame(true));
document.getElementById('btn-demo').addEventListener('click',        () => startGame(true));
document.getElementById('btn-retry').addEventListener('click',       () => startGame(false));
document.getElementById('btn-restart').addEventListener('click', () => {
  stopCamera();
  root.classList.remove('demo-bg');
  document.getElementById('screen-win').style.display = 'none';
  document.getElementById('screen-start').style.display = 'flex';
});
</script>
</body>
</html>
